<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OG Image Generator</title>
  <style>
    body { margin: 0; background: #111; display: flex; flex-direction: column; align-items: center; padding: 24px; gap: 16px; font-family: sans-serif; }
    canvas { border-radius: 12px; max-width: 100%; }
    button { padding: 12px 28px; background: #e879a0; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
<canvas id="c" width="1200" height="630"></canvas>
<button onclick="download()">Download og-image.png</button>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const W = 1200, H = 630;

function draw() {
  // Background gradient
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0,   '#0c0c14');
  bg.addColorStop(0.5, '#110d1a');
  bg.addColorStop(1,   '#0c0c14');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Subtle grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  // Glow orbs
  drawGlow(200, 180, 300, 'rgba(232,121,160,0.12)');
  drawGlow(950, 430, 260, 'rgba(167,139,250,0.10)');
  drawGlow(600, 500, 200, 'rgba(232,121,160,0.06)');

  // Cycle arc decoration (right side)
  drawCycleArc(900, 315, 190);

  // Pill dots row (decorative cycle days)
  drawDots(100, 520);

  // Main title: せいり
  ctx.save();
  ctx.font = 'bold 112px "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = 'rgba(232,121,160,0.5)';
  ctx.shadowBlur = 40;
  ctx.fillText('せいり', 96, 310);
  ctx.restore();

  // Romaji subtitle
  ctx.save();
  ctx.font = '400 38px "SF Pro Display", "Helvetica Neue", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.letterSpacing = '8px';
  ctx.fillText('S E I R I', 102, 372);
  ctx.restore();

  // Divider
  const div = ctx.createLinearGradient(100, 0, 560, 0);
  div.addColorStop(0, 'rgba(232,121,160,0.8)');
  div.addColorStop(1, 'rgba(232,121,160,0)');
  ctx.fillStyle = div;
  ctx.fillRect(100, 400, 460, 2);

  // Tagline
  ctx.save();
  ctx.font = '300 28px "SF Pro Display", "Helvetica Neue", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('a cycle tracking app', 102, 450);
  ctx.restore();
}

function drawGlow(x, y, r, color) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color);
  g.addColorStop(1, 'transparent');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}

function drawCycleArc(cx, cy, r) {
  const phases = [
    { color: '#e879a0', start: -0.1, end: 0.4, label: '🩸' },   // period
    { color: '#f9a8d4', start: 0.4,  end: 0.85, label: '🌱' },  // follicular
    { color: '#fbbf24', start: 0.85, end: 1.15, label: '✨' },  // ovulation
    { color: '#a78bfa', start: 1.15, end: 1.9,  label: '🍂' },  // luteal
  ];

  // Outer ring glow
  ctx.save();
  ctx.shadowColor = 'rgba(232,121,160,0.3)';
  ctx.shadowBlur = 20;

  phases.forEach(p => {
    ctx.beginPath();
    ctx.arc(cx, cy, r, p.start * Math.PI, p.end * Math.PI);
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 18;
    ctx.lineCap = 'round';
    ctx.stroke();
  });
  ctx.restore();

  // Inner ring (thinner, lighter)
  phases.forEach(p => {
    ctx.beginPath();
    ctx.arc(cx, cy, r - 36, p.start * Math.PI, p.end * Math.PI);
    ctx.strokeStyle = p.color + '44';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.stroke();
  });

  // Center dot
  ctx.beginPath();
  ctx.arc(cx, cy, 8, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fill();
}

function drawDots(startX, y) {
  const phases = [
    '#e879a0','#e879a0','#e879a0','#e879a0','#e879a0',
    '#86efac','#86efac','#86efac','#86efac','#86efac','#86efac','#86efac',
    '#fbbf24','#f9a8d4','#f9a8d4','#f0abfc',
    '#a78bfa','#a78bfa','#a78bfa','#a78bfa','#a78bfa','#a78bfa','#a78bfa',
    '#fda4af','#fda4af','#fda4af','#fda4af','#fda4af',
  ];
  const size = 14, gap = 22;
  phases.forEach((color, i) => {
    ctx.beginPath();
    ctx.arc(startX + i * gap, y, size / 2, 0, Math.PI * 2);
    ctx.fillStyle = color + 'bb';
    ctx.fill();
  });
}

draw();

function download() {
  const a = document.createElement('a');
  a.download = 'og-image.png';
  a.href = c.toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>
